<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C# 快速上手 — 面向产品经理的互动学习平台</title>
<link rel="stylesheet" href="https://cdn.staticfile.org/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.staticfile.org/codemirror/5.65.13/theme/neo.min.css">
<style>
:root {
  --ms-blue: #0078d4;
  --ms-light-gray: #f3f2f1;
  --ms-dark-gray: #242424;
  --ms-border: #e1dfdd;
  --ms-text: #323130;
  --ms-sidebar-bg: #faf9f8;
  --ms-success: #107c10;
  --ms-error: #a4262c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[v-cloak] { display: none !important; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: var(--ms-text);
  background-color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  height: 48px;
  background-color: var(--ms-dark-gray);
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 14px;
  font-weight: 600;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo-section { display: flex; align-items: center; gap: 10px; }
.logo-box { width: 18px; height: 18px; background-color: var(--ms-blue); display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; border-radius: 2px; }

.main-container { display: flex; flex: 1; overflow: hidden; }

aside {
  width: 280px;
  background-color: var(--ms-sidebar-bg);
  border-right: 1px solid var(--ms-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar-header { padding: 20px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--ms-border); color: #605e5c; text-transform: uppercase; }
.nav-item { padding: 12px 20px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; font-size: 13px; }
.nav-item:hover { background-color: #edebe9; }
.nav-item.active { background-color: #fff; border-left-color: var(--ms-blue); font-weight: 600; color: var(--ms-blue); }

main { flex: 1; display: flex; overflow: hidden; }

.article-container { flex: 1.2; padding: 40px; overflow-y: auto; border-right: 1px solid var(--ms-border); }
.article-container h1 { font-size: 28px; margin-bottom: 20px; color: #242424; }
.article-container h2 { font-size: 20px; margin: 24px 0 12px; border-bottom: 1px solid var(--ms-border); padding-bottom: 6px; }
.article-container h3 { font-size: 16px; margin: 18px 0 10px; color: var(--ms-blue); }
.article-container p { margin-bottom: 14px; font-size: 14px; line-height: 1.6; }
.article-container code { background: #f3f2f1; padding: 2px 4px; border-radius: 3px; font-family: monospace; }
.article-container pre { background: #f3f2f1; padding: 12px; border-radius: 4px; margin: 10px 0; font-size: 13px; overflow-x: auto; }

.step-box { background: #f3f9fd; border-left: 4px solid var(--ms-blue); padding: 15px; margin: 15px 0; }
.step-num { font-weight: 700; color: var(--ms-blue); margin-right: 8px; }

.exercise-section { margin-top: 30px; border-top: 2px solid var(--ms-blue); padding-top: 20px; }
.exercise-card { background: #fff; border: 1px solid var(--ms-border); border-radius: 4px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
.exercise-card:hover { border-color: var(--ms-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.exercise-card.active { border-left: 4px solid var(--ms-blue); background: #f9f9f9; }
.exercise-card h4 { font-size: 14px; margin-bottom: 5px; }

/* Editor Panel */
.editor-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
.editor-header { padding: 10px 20px; background: #faf9f8; border-bottom: 1px solid var(--ms-border); display: flex; justify-content: space-between; align-items: center; }
.btn-group { display: flex; gap: 8px; }
.btn { border: none; padding: 6px 16px; border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 600; }
.run-btn { background: var(--ms-blue); color: #fff; }
.run-btn:hover { background: #005a9e; }
.clear-btn { background: #fff; border: 1px solid var(--ms-border); color: #323130; }
.clear-btn:hover { background: #f3f2f1; }

.CodeMirror { flex: 1; font-family: 'Cascadia Code', monospace; font-size: 14px; }

.output-container { height: 250px; border-top: 1px solid var(--ms-border); display: flex; flex-direction: column; background: #f3f2f1; }
.output-header { padding: 8px 20px; font-size: 12px; font-weight: 700; color: #605e5c; border-bottom: 1px solid var(--ms-border); display: flex; justify-content: space-between; }
.output-content { flex: 1; padding: 12px 20px; font-family: monospace; font-size: 13px; white-space: pre-wrap; overflow-y: auto; }
.validation-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; color: #fff; }
.success-bg { background: var(--ms-success); }
.error-bg { background: var(--ms-error); }
</style>
</head>
<body>

<div id="app" v-cloak style="height: 100vh; display: flex; flex-direction: column;">
  <header>
    <div class="logo-section">
      <div class="logo-box">C#</div>
      <span>C# 快速上手 - 互动学习平台</span>
    </div>
    <div style="font-size: 12px; opacity: 0.8;">Day {{ currentDay }} / 10</div>
  </header>

  <div class="main-container">
    <aside>
      <div class="sidebar-header">学习章节</div>
      <div 
        v-for="(day, index) in syllabus" 
        :key="index"
        :class="['nav-item', { active: currentDay === index + 1 }]"
        @click="selectDay(index + 1)"
      >
        {{ index + 1 }}. {{ day.title }}
      </div>
    </aside>

    <main>
      <div class="article-container">
        <div v-html="currentContent"></div>

        <div class="exercise-section" v-if="currentExercises.length">
          <h3>✍️ 课后动手练</h3>
          <div 
            v-for="(ex, i) in currentExercises" 
            :key="i"
            :class="['exercise-card', { active: activeExerciseIndex === i }]"
            @click="loadExercise(i)"
          >
            <h4>{{ i + 1 }}. {{ ex.title }}</h4>
          </div>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-header">
          <span style="font-size: 12px; font-weight: 700;">{{ activeExerciseTitle }}</span>
          <div class="btn-group">
            <button class="btn clear-btn" @click="clearEditor">清空</button>
            <button class="btn run-btn" @click="runCode" :disabled="isRunning">
              {{ isRunning ? '⏳ 运行中...' : '▶ 运行并校验' }}
            </button>
          </div>
        </div>
        <textarea id="editor"></textarea>
        
        <div class="output-container">
          <div class="output-header">
            <span>控制台输出</span>
            <span v-if="validationStatus" :class="['validation-badge', validationStatus === 'Correct' ? 'success-bg' : 'error-bg']">
              {{ validationStatus === 'Correct' ? '🎉 校验通过' : '❌ 结果不匹配' }}
            </span>
          </div>
          <div class="output-content">{{ outputText || '代码运行结果将在此显示...' }}</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.staticfile.org/vue/3.3.4/vue.global.prod.js"></script>
<script src="https://cdn.staticfile.org/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdn.staticfile.org/codemirror/5.65.13/mode/clike/clike.min.js"></script>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const syllabus = [
  {
    title: "Day 1: 环境与基础语法结构",
    content: `
      <h1>第一章：从零开始运行 C#</h1>
      <p>欢迎。作为产品经理，理解开发的第一步是：<strong>程序是如何被组织并运行的</strong>。</p>

      <div class="step-box"><span class="step-num">Step 1</span><strong>基础结构：三层盒子模型</strong></div>
      <p>C# 的代码像俄罗斯套娃，每一层都有其作用：</p>
      <pre>
using System; // 第一层：引用（我要用哪些工具？）

namespace MyApp // 第二层：命名空间（我是谁？防止名字重复）
{
    class Program // 第三层：类（我是做什么的？代码的容器）
    {
        static void Main() // 第四层：方法（从哪里开始跑？）
        {
            Console.WriteLine("Hi"); 
        }
    }
}</pre>

      <div class="step-box"><span class="step-num">Step 2</span><strong>指令的终点：分号</strong></div>
      <p>在 C# 中，每一行独立的指令都必须以 <code>;</code> 结尾，否则电脑会认为你话还没说完。</p>

      <div class="step-box"><span class="step-num">Step 3</span><strong>转义字符：特殊的打印技巧</strong></div>
      <p>如果你想在一段话中换行，直接按回车是不行的，你需要用：</p>
      <ul>
        <li><code>\\n</code>: 代表“换行”。</li>
        <li><code>\\t</code>: 代表“Tab 缩进”（对齐数据非常有用）。</li>
        <li><code>\\"</code>: 代表要在引号里面打印一个“引号”本身。</li>
      </ul>
      <p><strong>练习提示：</strong> <code>"Name:\\tNeal"</code> 会显示为 <code>Name:    Neal</code>。</p>
    `,
    exercises: [
      { title: "打印初体验", desc: "输出文字：'Day 1 Success'", template: 'using System;\nclass Program { static void Main() {\n    // 写下你的代码\n}\n}', expected: "Day 1 Success" },
      { title: "换行与对齐", desc: "输出两行：第一行'A', 第二行缩进后的'B'", template: 'using System;\nclass Program { static void Main() {\n    // 使用 \\n 和 \\t\n}\n}', expected: "A\n\tB" }
    ]
  },
  {
    title: "Day 2: 变量与数据存储深度探索",
    content: `
      <h1>第二章：数据的分类与存放</h1>
      <p>程序不仅要打印，更要处理数据。今天我们要学会如何“记住”信息。</p>

      <div class="step-box"><span class="step-num">Step 1</span><strong>数据的五大元老</strong></div>
      <ul>
        <li><code>string</code>: 文本。必须用双引号 <code>"Neal"</code>。</li>
        <li><code>int</code>: 整数。如 <code>100</code>。</li>
        <li><code>decimal</code>: 价格/金额。<strong>必须加 m 后缀</strong>，如 <code>19.99m</code>。</li>
        <li><code>bool</code>: 开关。只有 <code>true</code> 或 <code>false</code>。</li>
        <li><code>var</code>: 自动挡。由电脑根据右边的值自动猜类型（最常用）。</li>
      </ul>

      <div class="step-box"><span class="step-num">Step 2</span><strong>字符串插值：现代化的拼接</strong></div>
      <p>以前拼接字符串用 <code>+</code>，现在我们用 <code>$</code>，更优雅：</p>
      <pre>string name = "Neal";
Console.WriteLine($"Hello {name}");</pre>

      <div class="step-box"><span class="step-num">Step 3</span><strong>变量的命名规范</strong></div>
      <p>C# 习惯使用<strong>驼峰命名法</strong>：第一个单词小写，后续单词大写，如 <code>orderCount</code>。</p>
    `,
    exercises: [
      { title: "价格变量练习", desc: "定义 decimal price = 9.99m; 并打印它", template: 'using System;\nclass Program { static void Main() {\n    \n}\n}', expected: "9.99" },
      { title: "现代插值挑战", desc: "定义 user='Neal', age=25, 输出 'Neal is 25'", template: 'using System;\nclass Program { static void Main() {\n    \n}\n}', expected: "Neal is 25" }
    ]
  },
  { title: "Day 3: 业务逻辑分支 (If/Else/Switch)", content: "<h1>第三章：程序的决策</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 4: 批量处理数据 (Arrays/Lists)", content: "<h1>第四章：告别繁琐</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 5: 模块化：封装你的逻辑", content: "<h1>第五章：方法与复用</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 6: 面向对象：建模业务实体", content: "<h1>第六章：类与对象</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 7: 解耦：接口与契约编程", content: "<h1>第七章：Interface 接口</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 8: 生产力：LINQ 数据查询", content: "<h1>第八章：像写 SQL 一样写 C#</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 9: 稳健性：异常处理与文件", content: "<h1>第九章：容错与存储</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] },
  { title: "Day 10: 现代响应：异步编程", content: "<h1>第十章：Async/Await</h1><p>内容正在根据步进式原则重写中...</p>", exercises: [] }
];

createApp({
  setup() {
    const currentDay = ref(1);
    const activeExerciseIndex = ref(0);
    const outputText = ref('');
    const isRunning = ref(false);
    const validationStatus = ref(null);
    let editor = null;

    const currentContent = computed(() => syllabus[currentDay.value - 1]?.content || '');
    const currentExercises = computed(() => syllabus[currentDay.value - 1]?.exercises || []);
    const activeExerciseTitle = computed(() => {
      const ex = currentExercises.value[activeExerciseIndex.value];
      return ex ? `正在练习: ${ex.title}` : '自由练习区';
    });

    const selectDay = (day) => {
      currentDay.value = day;
      activeExerciseIndex.value = 0;
      loadExercise(0);
    };

    const loadExercise = (index) => {
      activeExerciseIndex.value = index;
      const ex = currentExercises.value[index];
      if (ex && editor) {
        editor.setValue(ex.template);
        outputText.value = '';
        validationStatus.value = null;
      }
    };

    const clearEditor = () => {
      if (editor) editor.setValue('');
      outputText.value = '';
      validationStatus.value = null;
    };

    const runCode = async () => {
      const code = editor.getValue();
      isRunning.value = true;
      outputText.value = '';
      validationStatus.value = null;

      try {
        const response = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ script: code, language: 'csharp', versionIndex: '3' })
        });
        const result = await response.json();
        
        if (result.output) {
          const actualOutput = result.output.trim();
          outputText.value = actualOutput;
          
          const expected = currentExercises.value[activeExerciseIndex.value]?.expected;
          if (expected) {
            const formattedExpected = expected.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
            if (actualOutput === formattedExpected) {
              validationStatus.value = 'Correct';
            } else {
              validationStatus.value = 'Incorrect';
            }
          }
        } else if (result.error) {
          outputText.value = result.error;
        }
      } catch (err) {
        outputText.value = '错误: ' + err.message;
      } finally {
        isRunning.value = false;
      }
    };

    onMounted(() => {
      editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
        mode: 'text/x-csharp',
        theme: 'neo',
        lineNumbers: true,
        indentUnit: 4,
        matchBrackets: true,
        lineWrapping: true
      });
      loadExercise(0);
    });

    return {
      syllabus,
      currentDay,
      currentContent,
      currentExercises,
      activeExerciseIndex,
      activeExerciseTitle,
      outputText,
      isRunning,
      validationStatus,
      selectDay,
      loadExercise,
      runCode,
      clearEditor
    };
  }
}).mount('#app');
</script>
</body>
</html>
